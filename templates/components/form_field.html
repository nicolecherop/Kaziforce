<div class="field {% if field.errors %}field-error{% endif %}">
    <div class="field-label">{{ field.label_tag }}{% if reset_link %}
        <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
    {% endif %}
</div>
<div class="input-wrap">{{ field }}{% if field.field.widget.input_type == "password" %}
    <button type="button"
            class="password-toggle"
            data-password-target="{{ field.id_for_label }}"
            aria-label="Show {{ field.label|lower }}"
            aria-pressed="false">
        <svg class="icon" aria-hidden="true">
            <use href="#icon-eye" />
        </svg>
    </button>
{% endif %}
</div>
{% if field.help_text %}
    <div class="field-hint" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</div>
{% endif %}
{% if field.errors %}
    <div class="field-errors">{{ field.errors }}</div>
{% endif %}
</div>
